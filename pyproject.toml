[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cricq"
version = "1.0.0"
description = "Pressure intelligence for cricket: rates the pressure on every ball and ranks the most reliable players under pressure."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary — all rights reserved by the project owner" }
authors = [{ name = "[Your name / team name]" }]
keywords = ["cricket", "analytics", "pressure", "streamlit", "ipl"]
dependencies = [
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
    "pyarrow>=15,<30",
    "pyyaml>=6,<7",
    "streamlit>=1.40,<2",
    "plotly>=5.20,<8",
    "matplotlib>=3.8,<4",
    "reportlab>=4.0,<6",
    "pillow>=10,<13",
    "pypdf>=4,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6", "pip-audit>=2.7", "pre-commit>=3.7"]

[project.scripts]
cricq-pipeline = "pipeline:cli"

[tool.setuptools]
py-modules = ["pipeline"]
packages = ["engine"]

# ---------------- tooling ----------------
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", "outputs", "report/figures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# E501: the formatter owns line length; long user-facing strings are allowed.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["engine", "components"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
